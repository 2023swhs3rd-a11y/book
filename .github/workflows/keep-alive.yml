# Supabase 무료 프로젝트는 7일 동안 접속이 없으면 일시 정지됩니다.
# 방학처럼 아무도 접속하지 않는 기간에도 멈추지 않도록, 3일마다 게시판을 한 번 조회합니다.
# 주소와 키는 js/config.js 에서 읽습니다(학생 화면에 이미 공개된 값입니다).
name: Supabase 깨어 있기

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 낮 12시 17분(한국 시간)
  workflow_dispatch:          # Actions 탭에서 직접 실행해 볼 수도 있습니다

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 게시판 조회
        run: |
          URL=$(grep -oP 'SUPABASE_URL:\s*"\K[^"]+' js/config.js)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' js/config.js)
          AUTH=()
          if [[ "$KEY" == eyJ* ]]; then AUTH=(-H "Authorization: Bearer $KEY"); fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/get_board" \
            -H "apikey: $KEY" "${AUTH[@]}" -H "Content-Type: application/json" -d '{}')
          echo "응답 코드: $code"
          test "$code" = "200"
